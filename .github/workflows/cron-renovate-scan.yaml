name: Renovate Update Scan

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JF_URL: "https://artifacts-artefacts.devops.cloud-nuage.canada.ca"

jobs:
  renovate:
    runs-on: ubuntu-latest

    environment: renovate

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Create App token
        id: create_token
        uses: ssc-sp/.github/.github/actions/create-app-token@main
        with:
          app-id: ${{ vars.IMAGES_RENOVATE_APP_ID }}
          private-key: ${{ secrets.IMAGES_RENOVATE_APP_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ steps.create_token.outputs.token }}

      - name: Setup JFrog CLI & Authenticate
        id: setup-jfrog
        uses: jfrog/setup-jfrog-cli@1641575d87647fb969c0545f0b6a76873e328b7c # v5.0.0
        env:
          JF_URL: ${{ env.JF_URL }}
        with:
          oidc-provider-name: github-oidc
          version: 2.91.0

      - name: Run Renovate
        uses: renovatebot/github-action@6d859fc95779be83a0335ca704879b47e5d79641 # v46.1.16
        with:
          configurationFile: renovate.json
          token: ${{ steps.create_token.outputs.token }}
        env:
          LOG_LEVEL: debug
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_HOST_RULES: >-
            [{
              "hostType": "docker",
              "matchHost": "artifacts-artefacts.devops.cloud-nuage.canada.ca",
              "username": ${{ toJSON(steps.setup-jfrog.outputs.oidc-user) }},
              "password": ${{ toJSON(steps.setup-jfrog.outputs.oidc-token) }}
            }]
