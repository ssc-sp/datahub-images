name: Frogbot Repo Full Scan

on:
  schedule:
    - cron: "34 7 * * *" 
  workflow_dispatch:

permissions: {}

env:
  JF_URL: "https://artifacts-artefacts.devops.cloud-nuage.canada.ca"

jobs:
  full-scan:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup JFrog CLI with OIDC
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e # v5
        id: setup-jfrog-cli
        env:
          JFROG_CLI_AVOID_NEW_VERSION_WARNING: "true"
        with:
          oidc-provider-name: github-oidc
          version: 2.91.0

      - name: Run Frogbot
        uses: jfrog/frogbot@3a1daa5a4f0a785b3ab48c5fdb6320b8d7d877cb # v2.32.2
        env:
          JF_ACCESS_TOKEN: "${{ steps.setup-jfrog-cli.outputs.oidc-token }}"
          JF_GIT_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          JF_GIT_PROVIDER: github
          JF_GIT_API_ENDPOINT: https://api.github.com
          JF_GIT_OWNER: "${{ github.repository_owner }}"
          JF_GIT_REPO: "${{ github.event.repository.name }}"
          JF_GIT_BASE_BRANCH: main
          CI: "true"