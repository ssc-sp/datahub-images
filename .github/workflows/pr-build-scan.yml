name: Pull Request - Build and Scan

on:
  pull_request:
    branches:
      - main
    paths:
      - "managed-containers/**"

permissions: read-all

env:
  JF_URL: "https://artifacts-artefacts.devops.cloud-nuage.canada.ca"
  JF_PROJECT: "ssc-fsdh"

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk-matrix.outputs.matrix }}
      count: ${{ steps.mk-matrix.outputs.count }}
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generated Changed Files JSON
        id: changed
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.sha }}"

          # Use -z for NUL-delimited robustness; also filter to managed-containers/**
          changed_files_json="$(
            git diff --name-only -z "$base" "$head" -- 'managed-containers/**' \
            | jq -Rs 'split("\u0000") | map(select(length>0))'
          )"

          echo "Changed files JSON:"
          echo "$changed_files_json" | jq '.'

          {
            echo 'changed_files<<__JSON__'
            echo "$changed_files_json"
            echo '__JSON__'
          } >> "$GITHUB_OUTPUT"

      - name: Generated associated effected Dockerfiles.
        id: mk-matrix
        run: |
          set -euo pipefail

          changed_files_json="${STEPS_CHANGED_OUTPUTS_CHANGED_FILES}"

          # Derive unique component roots: managed-containers/<component>
          components="$(
            echo "$changed_files_json" \
            | jq -r '.[]' \
            | awk -F/ '/^managed-containers\// && NF>=2 {print $1"/"$2}' \
            | awk '!seen[$0]++'
          )"

          dockerfiles_list_raw=""

          # Include top-level Dockerfile per component if present
          while IFS= read -r comp; do
            [ -z "$comp" ] && continue
            if [ -f "$comp/Dockerfile" ]; then
              dockerfiles_list_raw+="$comp/Dockerfile"$'\n'
            fi
          done <<< "$components"

          # Also include any Dockerfiles that were themselves changed (nested images)
          direct_dockerfiles="$(
            echo "$changed_files_json" | jq -r '.[]' | grep -E '(^|/)[Dd]ockerfile$' || true
          )"
          dockerfiles_list_raw+="$direct_dockerfiles"$'\n'

          # Normalize paths, dedupe, AND CHECK EXISTENCE
          normalized_paths="$(
            printf '%s' "$dockerfiles_list_raw" \
            | sed '/^$/d; s#^\./##; s#/\+#/#g' \
            | while IFS= read -r p; do
                [ -z "$p" ] && continue
                
                # Resolve path (handle ../ and .)
                resolved_path=$(realpath -m -- "$p")
                
                # If the Dockerfile was deleted in this PR, 'realpath' resolves the string,
                # but '-f' will return false, preventing it from being added to the build matrix.
                if [ -f "$resolved_path" ]; then
                  echo "$resolved_path"
                fi
              done
          )"

          dockerfiles_all="$(printf '%s\n' "$normalized_paths" | awk '!seen[$0]++')"
          count="$(printf '%s\n' "$dockerfiles_all" | sed '/^$/d' | wc -l | tr -d ' ')"

          echo "Found $count Dockerfile(s) to build:"
          printf '%s\n' "$dockerfiles_all"

          if [ "$count" -eq 0 ]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          short_sha="$(printf '%s' "$PR_HEAD_SHA" | cut -c1-12)"
          image_tag="pr-${PR_NUMBER}-run-${GITHUB_RUN_NUMBER}-attempt-${GITHUB_RUN_ATTEMPT}-${short_sha}"

          echo "Using image tag: $image_tag"

          matrix_json=$(
            while IFS= read -r dockerfile; do
              [ -z "$dockerfile" ] && continue
              context="$(dirname -- "$dockerfile")"
              base="$(basename -- "$context")"
              safe_base="$(printf '%s' "$base" \
                | tr '[:upper:]' '[:lower:]' \
                | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//; s/-{2,}/-/g')"
              [ -z "$safe_base" ] && safe_base="image"
              image_name="${safe_base}:${image_tag}"
              printf '{"dockerfile":"%s","context":"%s","image":"%s","name":"%s"}\n' \
                "$dockerfile" "$context" "$image_name" "$safe_base"
            done <<< "$dockerfiles_all" | jq -s '{include: .}'
          )

          {
            echo 'matrix<<__JSON__'
            echo "$matrix_json"
            echo '__JSON__'
          } >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
        env:
          STEPS_CHANGED_OUTPUTS_CHANGED_FILES: ${{ steps.changed.outputs.changed_files }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  # Job 1: Build the image and output it as an artifact
  build:
    permissions:
      id-token: write
      contents: read
    needs: [prepare-matrix]
    if: ${{ fromJson(needs.prepare-matrix.outputs.count) > 0 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for GC Secure Artifacts usage
        id: check-jfrog
        run: |
          set -euo pipefail
          dockerfile="${MATRIX_DOCKERFILE}"

          if grep -Eq '^[[:space:]]*FROM[[:space:]]+artifacts-artefacts\.devops\.cloud-nuage\.canada\.ca/' "$dockerfile"; then
            echo "Detected JFrog base image reference"
            echo "uses_jfrog=true" >> "$GITHUB_OUTPUT"
          else
            echo "No JFrog base image found"
            echo "uses_jfrog=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          MATRIX_DOCKERFILE: ${{ matrix.dockerfile }}

      - name: Setup JFrog CLI
        id: setup-jfrog-cli
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e # v5.1.0
        with:
          oidc-provider-name: github-oidc

      - name: GC Secure Artifacts Docker login
        if: ${{ steps.check-jfrog.outputs.uses_jfrog == 'true' }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: https://artifacts-artefacts.devops.cloud-nuage.canada.ca
          username: ${{ steps.setup-jfrog-cli.outputs.oidc-user }}
          password: ${{ steps.setup-jfrog-cli.outputs.oidc-token }}

      - name: Validate top-level folder (no spaces under managed-containers/)
        run: |
          set -euo pipefail
          file="${MATRIX_DOCKERFILE}"

          rel_path="$(printf '%s\n' "$file" | sed -E 's#^.*(managed-containers/.*)$#\1#')"
          component="$(printf '%s\n' "$rel_path" | awk -F/ '{print $2}')"

          if printf '%s' "$component" | grep -q '[[:space:]]'; then
            echo "::error title=Invalid component folder name::The top-level folder under 'managed-containers' contains whitespace: '$component'. Rename it (use '-' or '_'). Spaces are allowed in subfolders. Offending path: $rel_path"
            exit 1
          fi
        env:
          MATRIX_DOCKERFILE: ${{ matrix.dockerfile }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build image
        run: |
          set -euo pipefail
          echo "Building ${MATRIX_IMAGE} from ${MATRIX_DOCKERFILE} (context: ${MATRIX_CONTEXT})"
          docker buildx build \
            --load \
            --no-cache \
            -t "${MATRIX_IMAGE}" \
            -f "${MATRIX_DOCKERFILE}" \
            "${MATRIX_CONTEXT}"
        env:
          MATRIX_IMAGE: ${{ matrix.image }}
          MATRIX_DOCKERFILE: ${{ matrix.dockerfile }}
          MATRIX_CONTEXT: ${{ matrix.context }}

      - name: Save Image to Tarball
        run: |
          docker save "${MATRIX_IMAGE}" -o image.tar
        env:
          MATRIX_IMAGE: ${{ matrix.image }}

      - name: Upload Image Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-tar-${{ matrix.name }}
          path: image.tar
          retention-days: 1

  trivy-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    needs: [prepare-matrix, build]
    if: ${{ fromJson(needs.prepare-matrix.outputs.count) > 0 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Image Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-tar-${{ matrix.name }}

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1

      - name: Generate Trivy SARIF report
        run: |
          set -euo pipefail

          ignore_file="${MATRIX_CONTEXT}/.trivyignore"

          trivy_args=(
            image
            --quiet
            --scanners "vuln,secret"
            --format sarif
            --severity CRITICAL
            --exit-code 0
            --output trivy-report.sarif
            --input image.tar
          )

          if [ -f "$ignore_file" ]; then
            echo "Using Trivy ignore file: $ignore_file"
            trivy_args+=(--ignorefile "$ignore_file")
          else
            echo "No Trivy ignore file found for this image."
          fi

          trivy "${trivy_args[@]}"

          echo "Generated SARIF:"
          jq '.version, (.runs // [] | length)' trivy-report.sarif
        env:
          MATRIX_CONTEXT: ${{ matrix.context }}

      - name: Validate Trivy SARIF before upload
        id: validate-sarif
        run: |
          set -euo pipefail

          jq . trivy-report.sarif > /dev/null

          runs_count="$(jq '.runs // [] | length' trivy-report.sarif)"
          results_count="$(jq '[.runs[]?.results[]?] | length' trivy-report.sarif)"

          echo "SARIF runs: $runs_count"
          echo "SARIF results: $results_count"

          if [ "$runs_count" -eq 0 ]; then
            echo "::notice title=Skipping SARIF upload::Trivy generated SARIF with zero runs. GitHub code scanning rejects empty runs arrays."
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "upload=true" >> "$GITHUB_OUTPUT"

      - name: Upload Trivy SARIF to GitHub
        if: ${{ steps.validate-sarif.outputs.upload == 'true' }}
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          sarif_file: trivy-report.sarif
          category: trivy-${{ matrix.name }}

      - name: Enforce Trivy vulnerability gate
        run: |
          set -euo pipefail

          ignore_file="${MATRIX_CONTEXT}/.trivyignore"

          trivy_args=(
            image
            --quiet
            --scanners "vuln,secret"
            --format table
            --exit-code 1
            --severity CRITICAL
            --input image.tar
          )

          if [ -f "$ignore_file" ]; then
            echo "Using Trivy ignore file: $ignore_file"
            trivy_args+=(--ignorefile "$ignore_file")
          else
            echo "No Trivy ignore file found for this image."
          fi

          trivy "${trivy_args[@]}"
        env:
          MATRIX_CONTEXT: ${{ matrix.context }}

  xray-scan:
    permissions:
      id-token: write
      contents: read
      security-events: write
      actions: read
    needs: [prepare-matrix, build]
    if: ${{ fromJson(needs.prepare-matrix.outputs.count) > 0 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Image Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-tar-${{ matrix.name }}

      - name: Load Image to Docker Daemon
        run: |
          docker load -i image.tar

      - name: Setup JFrog CLI
        id: setup-jfrog-cli
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e # v5.1.0
        with:
          oidc-provider-name: github-oidc

      - name: Scan Image (JFrog Xray)
        run: |
          set -euo pipefail

          jf docker scan "${MATRIX_IMAGE}" \
            --project="${JF_PROJECT}" \
            --fail=false \
            --format=sarif > xray-report.sarif

          echo "Generated SARIF:"
          jq '.version, (.runs // [] | length)' xray-report.sarif
        env:
          MATRIX_IMAGE: ${{ matrix.image }}

      - name: Validate SARIF before upload
        id: validate-sarif
        run: |
          set -euo pipefail

          jq . xray-report.sarif > /dev/null

          runs_count="$(jq '.runs // [] | length' xray-report.sarif)"
          results_count="$(jq '[.runs[]?.results[]?] | length' xray-report.sarif)"

          echo "SARIF runs: $runs_count"
          echo "SARIF results: $results_count"

          if [ "$runs_count" -eq 0 ]; then
            echo "::notice title=Skipping SARIF upload::JFrog generated SARIF with zero runs. GitHub code scanning rejects empty runs arrays."
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "upload=true" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to GitHub
        if: ${{ steps.validate-sarif.outputs.upload == 'true' }}
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          sarif_file: xray-report.sarif
          category: jfrog-xray-${{ matrix.name }}
