---
name: Code Quality

on:
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Remove previous Super-linter PR comments
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Looking for previous Super-linter comments on PR #${PR_NUMBER}"

          comment_ids="$(
            gh api \
              "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              --paginate \
              --jq '.[]
                | select(.user.type == "Bot")
                | select(.body | contains("Powered by [Super-linter]"))
                | .id'
          )"

          if [ -z "${comment_ids}" ]; then
            echo "No previous Super-linter comments found."
            exit 0
          fi

          echo "${comment_ids}" | while read -r comment_id; do
            [ -z "${comment_id}" ] && continue

            echo "Deleting Super-linter comment ${comment_id}"

            gh api \
              --method DELETE \
              "repos/${REPO}/issues/comments/${comment_id}"
          done

      - name: Code Linting
        uses: super-linter/super-linter/slim@9e863354e3ff62e0727d37183162c4a88873df41 # v8.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPPRESS_POSSUM: true
          SAVE_SUPER_LINTER_SUMMARY: true
          FAIL_ON_INVALID_GITHUB_ACTIONS_EVENT_CONFIGURATION: true
          NO_COLOR: "1"
          FORCE_COLOR: "0"
          TERM: dumb
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_CHECKOV: false
          VALIDATE_JSCPD: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_TRIVY: false
          VALIDATE_PYTHON_PYINK: false
          LINTER_RULES_PATH: /
          PYTHON_BLACK_CONFIG_FILE: pyproject.toml
          PYTHON_FLAKE8_CONFIG_FILE: .flake8
          PYTHON_PYLINT_CONFIG_FILE: .pylintrc
