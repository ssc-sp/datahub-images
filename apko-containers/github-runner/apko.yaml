contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub

  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - bash
    - curl
    - jq
    - icu
    - openssl
    - krb5
    - zlib
    - libgcc
    - libstdc++
    - busybox
    - unzip
    - sudo
    - git
    - gh
    - nodejs
    - python-3
    - py3-pip
    - github-runner-app@local

accounts:
  groups:
    - groupname: runner
      gid: 1001
    - groupname: docker
      gid: 123
  users:
    - username: runner
      uid: 1001
      gid: 1001
  run-as: 1001

environment:
  HOME: /home/runner
  DEBIAN_FRONTEND: noninteractive
  RUNNER_MANUALLY_TRAP_SIG: "1"
  ACTIONS_RUNNER_PRINT_LOG_TO_STDOUT: "1"
  ImageOS: ubuntu24

work-dir: /home/runner

entrypoint:
  command: /usr/bin/entrypoint.sh